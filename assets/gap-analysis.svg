<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #f2f4f7; }
      .panel { fill: #ffffff; stroke: #dde3eb; }
      .header { fill: #edf2f6; }
      .text { font-family: Arial, sans-serif; fill: #27364a; }
      .muted { fill: #64748b; }
      .rowAlt { fill: #fafbfc; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="70" y="60" class="text" style="font-size:34px;font-weight:700;">Gap Analysis</text>

  <rect x="40" y="90" width="1515" height="250" rx="12" class="panel"/>
  <rect x="40" y="90" width="1515" height="44" rx="12" class="header"/>
  <text x="80" y="120" class="text" style="font-size:15px;font-weight:700;">supplier_name</text>
  <text x="520" y="120" class="text" style="font-size:15px;font-weight:700;">missing_items</text>
  <text x="950" y="120" class="text" style="font-size:15px;font-weight:700;">missing_fields</text>
  <text x="1265" y="120" class="text" style="font-size:15px;font-weight:700;">items_missing_packaging</text>
  <text x="1500" y="120" class="text" style="font-size:15px;font-weight:700;">items_missing_portion</text>

  <g class="text" style="font-size:15px;">
    <text x="80" y="180">Quotation_Vendor_7_MindaCorp</text>
    <text x="80" y="230">Quotation_Vendor_10_GabrielIndia</text>
    <text x="80" y="280">Quotation_Vendor_4_KalyaniTechno</text>
    <text x="520" y="180">1, 2, 3, 4, air filter</text>
    <text x="520" y="230">1, 2, 3, 4, air filter</text>
    <text x="520" y="280">1, 2, 3, 4, air filter</text>
    <text x="950" y="180">Delivery terms, Payment terms, Warranty, Delivery lead time</text>
    <text x="950" y="230">Delivery terms, Payment terms, Warranty, Delivery lead time</text>
    <text x="950" y="280">Delivery terms, Payment terms, Warranty, Delivery lead time</text>
    <text x="1265" y="180">None</text>
    <text x="1265" y="230">None</text>
    <text x="1265" y="280">None</text>
    <text x="1500" y="180">None</text>
    <text x="1500" y="230">None</text>
    <text x="1500" y="280">None</text>
  </g>

  <rect x="40" y="390" width="1515" height="250" rx="12" class="panel"/>
  <text x="70" y="430" class="text" style="font-size:30px;font-weight:700;">Lower gap_score = more complete, compliant quotation relative to the RFQ.</text>
  <rect x="115" y="470" width="1340" height="90" rx="10" class="header"/>
  <text x="150" y="525" class="text" style="font-size:18px; font-weight:700;">Recommended supplier: ABC Automotive Pvt. Ltd. Company: Varroc Engineering Limited</text>
