<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #f3f5f7; }
      .panel { fill: #ffffff; stroke: #dfe4ea; }
      .soft { fill: #eef1f4; }
      .line { stroke: #d9dee6; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; fill: #27364a; }
      .muted { fill: #66758b; }
      .title { font-size: 34px; font-weight: 700; }
      .sub { font-size: 22px; }
      .label { font-size: 18px; fill: #59687e; }
      .small { font-size: 15px; }
      .pill { fill: #e9eef5; }
      .button { fill: #ff5d5d; }
      .buttonText { fill: #ffffff; font-size: 18px; font-weight: 700; }
      .tab { fill: #eef2f7; stroke: #d4dae5; }
      .selected { fill: #fff; stroke: #ff5d5d; }
      .row { fill: #ffffff; }
      .alt { fill: #f8fafb; }
      .nav { fill: #f5f6f8; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>

  <rect x="0" y="0" width="330" height="900" class="nav"/>
  <rect x="0" y="0" width="330" height="70" fill="#f0f2f5"/>
  <circle cx="30" cy="35" r="9" fill="#f59e0b"/>
  <text x="60" y="42" class="text" style="font-size:20px;font-weight:700;">Language / भाषा</text>
  <rect x="20" y="90" width="290" height="52" rx="10" class="panel"/>
  <text x="45" y="122" class="text" style="font-size:18px;">Hindi (हिन्दी)</text>
  <text x="275" y="122" class="muted" style="font-size:18px;">▾</text>

  <text x="20" y="190" class="text" style="font-size:18px;font-weight:700;">System status</text>
  <circle cx="30" cy="220" r="6" fill="#c0c9d5"/>
  <text x="45" y="226" class="text small">OpenAI LLM:</text>
  <text x="175" y="226" class="muted small">not set</text>
  <circle cx="30" cy="255" r="6" fill="#24a148"/>
  <text x="45" y="261" class="text small">Embeddings:</text>
  <text x="175" y="261" class="muted small">local</text>

  <rect x="330" y="0" width="1270" height="900" class="bg"/>
  <text x="520" y="120" class="text title" style="font-size:46px; font-weight:700;">आपूर्तिकर्ता कोटेशन प्रबंधन</text>
  <text x="510" y="165" class="muted sub" style="font-size:24px;">तुलना, विश्लेषण और निर्णय के लिए RFQ और आपूर्तिकर्ता कोटेशन (Excel / PDF / Word) अपलोड करें।</text>

  <g>
    <rect x="460" y="220" width="480" height="180" rx="14" class="panel"/>
    <text x="500" y="262" class="text" style="font-size:30px; font-weight:700;">1. RFQ अपलोड करें</text>
    <rect x="500" y="290" width="390" height="70" rx="12" class="soft"/>
    <text x="623" y="332" class="muted" style="font-size:18px;">Drag and drop file here</text>
    <rect x="882" y="300" width="118" height="48" rx="10" class="panel" style="stroke:#cfd7e2;"/>
    <text x="922" y="331" class="text" style="font-size:17px;">Browse</text>
  </g>

  <g>
    <rect x="980" y="220" width="520" height="260" rx="14" class="panel"/>
    <text x="1030" y="262" class="text" style="font-size:30px; font-weight:700;">2. आपूर्तिकर्ता कोटेशन अपलोड करें</text>
    <rect x="1015" y="290" width="450" height="76" rx="12" class="soft"/>
    <text x="1130" y="330" class="muted" style="font-size:18px;">Drag and drop files here</text>
    <rect x="1360" y="300" width="82" height="42" rx="10" class="button"/>
    <text x="1395" y="329" class="buttonText" style="font-size:16px;">Browse</text>
    <rect x="1015" y="384" width="450" height="40" rx="8" class="soft"/>
    <text x="1045" y="409" class="text" style="font-size:18px;">Quotation_Vendor_1_BharatPrecision.xlsx</text>
    <line x1="1450" y1="395" x2="1460" y2="395" stroke="#ff5d5d" stroke-width="3"/>
  </g>

  <rect x="520" y="760" width="390" height="52" rx="10" class="button"/>
  <text x="655" y="794" class="buttonText" style="font-size:22px; font-weight:700;">डेटाबेस प्रोसेस करें</text>

  <g>
    <rect x="360" y="470" width="1160" height="120" rx="14" class="panel"/>
    <rect x="365" y="475" width="200" height="42" rx="8" class="tab"/>
    <text x="385" y="503" class="text" style="font-size:18px;">लागत तुलना</text>
    <line x1="360" y1="560" x2="1520" y2="560" class="line"/>
  </g>
</svg>
